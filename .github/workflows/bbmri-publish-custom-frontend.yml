name: BBMRI Publish and Build Docker Image

on:
  push:
    branches:
      - 'bbmri-master'
  workflow_dispatch:
    inputs:
      frontend_repo:
        description: 'Custom frontend repository (owner/name)'
        required: false
        default: 'BBMRI-ERIC/cbioportal-frontend'
      frontend_ref:
        description: 'Custom frontend branch or tag'
        required: false
        default: 'bbmri-master'

env:
  REGISTRY_NAME: ghcr.io
  IMAGE_NAME: bbmri-eric/cbioportal
  DOCKER_FILE: docker/web-and-data/Dockerfile
  FRONTEND_REPO: BBMRI-ERIC/cbioportal-frontend
  FRONTEND_REF: v6.4.1

permissions:
  packages: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Resolve frontend source
        shell: bash
        run: |
          FRONTEND_REPO_INPUT="${{ github.event.inputs.frontend_repo || env.FRONTEND_REPO }}"
          FRONTEND_REF_INPUT="${{ github.event.inputs.frontend_ref || env.FRONTEND_REF }}"

          FRONTEND_REF_INPUT="${FRONTEND_REF_INPUT//\\\"/\"}"
          FRONTEND_REF_INPUT="${FRONTEND_REF_INPUT#\"}"
          FRONTEND_REF_INPUT="${FRONTEND_REF_INPUT%\"}"

          echo "FRONTEND_REPO=$FRONTEND_REPO_INPUT" >> "$GITHUB_ENV"
          echo "FRONTEND_REF=$FRONTEND_REF_INPUT" >> "$GITHUB_ENV"

      - name: Check out custom frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: cbioportal-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify frontend checkout
        shell: bash
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la
          ls -la "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/cbioportal-frontend"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

          SAFE_FRONTEND_REF="$(printf '%s' "$FRONTEND_REF" \
            | tr '/:' '--' \
            | sed 's/[^A-Za-z0-9._-]/-/g')"

          echo "SAFE_FRONTEND_REF=$SAFE_FRONTEND_REF" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NAME }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with custom frontend
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/${{ env.DOCKER_FILE }}
          push: true
          build-contexts: |
            frontend-src=${{ github.workspace }}/cbioportal-frontend
          build-args: |
            FRONTEND_REPO=${{ env.FRONTEND_REPO }}
            FRONTEND_REF=${{ env.FRONTEND_REF }}
          tags: |
            ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.SAFE_FRONTEND_REF }}-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max